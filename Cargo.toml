[workspace]
members = [
    "orderbook-core",
    "market-maker",
    "simulator",
    "exchange-feed",
    "stat-arb",
    "metrics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Waleed Awan"]
license = "MIT"

[workspace.dependencies]
# Concurrency & lock-free
crossbeam = "0.8"
crossbeam-epoch = "0.9"
crossbeam-skiplist = "0.1"
crossbeam-channel = "0.5"
dashmap = "6.1"
parking_lot = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linear algebra (Kalman filter, cointegration)
nalgebra = "0.33"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics & TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP client (for REST snapshots)
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# RNG
rand = "0.8"
rand_distr = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Compression (for feed decompression)
flate2 = "1"

[package]
name = "microstructure-sim"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
orderbook-core = { path = "orderbook-core" }
market-maker = { path = "market-maker" }
simulator = { path = "simulator" }
exchange-feed = { path = "exchange-feed" }
stat-arb = { path = "stat-arb" }
metrics-engine = { path = "metrics" }

tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
